name: Android CI

on:
  release:
    types: [published]
  push:
    branches: [ "main" ]

env:
  RELEASE_TAG: ${{ github.event.release.tag_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Restore signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY_BASE64" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
              echo "Release signing key is required for tagged builds" >&2
              exit 1
            fi
            exit 0
          fi
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/signing_key.jks"
          test -s "$RUNNER_TEMP/signing_key.jks"
          echo "storyteller_f_sign_path=$RUNNER_TEMP/signing_key.jks" >> "$GITHUB_ENV"

      - name: Build app
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            bash gradlew :ping:assembleRelease
          else
            bash gradlew :ping:assembleAlpha
          fi
        env:
          storyteller_f_sign_alias: ${{ secrets.ALIAS }}
          storyteller_f_sign_store_password: ${{ secrets.STORE_PASSWORD }}
          storyteller_f_sign_key_password: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ping-apk
          path: |
            ping/build/outputs/apk/alpha/*.apk
            ping/build/outputs/apk/release/*.apk
          if-no-files-found: error

  release:
    name: Upload release assets
    needs: build
    if: (github.event_name == 'release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ping-apk
          path: release-assets

      - name: Upload release assets
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets found" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
